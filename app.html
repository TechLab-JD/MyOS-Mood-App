<div class="app-window" id="MoodApp">
  <div class="app-header"><span class="app-title">🙂 Mood Tracker</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="md">
      <div class="md-pick" id="md-pick"></div>
      <input id="md-note" class="md-note" placeholder="A word about today (optional)">
      <button id="md-save" class="md-save">Save today</button>
      <h4 class="md-h">Last 14 days</h4>
      <div id="md-hist" class="md-hist"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
